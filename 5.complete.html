<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주문 완료 | MONO</title>
    <link rel="stylesheet" href="./mono.css" />
    <script src="./mono.js" defer></script>
  </head>
  <body>
    <header class="header">
      <a class="logo" href="./1.mono.html">MONO<span>.</span></a>
      <nav>
        <a href="./1.mono.html">SHOP</a>
        <a href="./3.cart.html">CART <span id="cart-count">0</span></a>

    <main class="section narrow complete-page">
      <div class="complete-icon">✓</div>
      <p class="eyebrow">ORDER COMPLETED</p>
      <h1>주문이 완료되었습니다.</h1>
      <p class="subtext">MONO 연습용 주문이 정상적으로 처리되었습니다.</p>

      <section class="complete-card">
        <div class="summary-row">
          <span>주문 번호</span>
          <strong id="complete-number">-</strong>
        </div>
        <div class="summary-row">
          <span>주문자</span>
          <strong id="complete-name">-</strong>
        </div>
        <div class="summary-row">
          <span>결제 방법</span>
          <strong id="complete-payment">-</strong>
        </div>
        <div class="summary-row">
          <span>주문 금액</span>
          <strong id="complete-total">0원</strong>
        </div>
      </section>

      <a class="button dark full" href="./1.mono.html">쇼핑 계속하기</a>
    </main>

    <footer class="footer">
      <a class="logo" href="./1.mono.html">MONO<span>.</span></a>
