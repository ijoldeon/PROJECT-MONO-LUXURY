<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상품 상세 | MONO</title>
    <link rel="stylesheet" href="./mono.css" />
    <script src="./mono.js" defer></script>
  </head>
  <body>
    <header class="header">
      <a class="logo" href="./1.mono.html">MONO<span>.</span></a>
      <nav>
        <a href="./1.mono.html">SHOP</a>
        <a href="./3.cart.html">CART <span id="cart-count">0</span></a>
      </nav>
    </header>

    <main class="section">
      <p class="breadcrumb"><a href="./1.mono.html">SHOP</a> / PRODUCT</p>

      <section class="detail-layout">
        <div class="detail-image">
          <img id="detail-image" src="" alt="MONO 로고 상품 이미지" />
        </div>

        <div class="detail-info">
          <p id="detail-category" class="eyebrow"></p>
          <h1 id="detail-name">상품을 불러오는 중...</h1>
          <p id="detail-price" class="detail-price"></p>
          <p id="detail-description" class="description"></p>

          <label for="size-select">SIZE / OPTION</label>
          <select id="size-select">
            <option value="">옵션을 선택하세요</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="FREE">FREE / ONE SIZE</option>
          </select>

          <label for="detail-quantity">수량</label>
          <input
            id="detail-quantity"
            type="number"
            min="1"
            max="10"
            value="1"
          />

          <button id="add-to-cart" class="button dark full">
            장바구니 담기
          </button>
          <a class="button light full" href="./3.cart.html">장바구니로 이동</a>
          <p id="detail-message" class="message" aria-live="polite"></p>
          <a class="back-link" href="./1.mono.html">← 쇼핑 계속하기</a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <a class="logo" href="./1.mono.html">MONO<span>.</span></a>
      <p>대표 : 이성전</p>
      <p>문의 : leesj9702@naver.com</p>
      <p style="margin-top: 8px; color: #666; font-size: 10px">
        웹 개발 연습용 쇼핑몰 · 실제 결제 없음
      </p>
    </footer>
  </body>
</html>
